services:
  touchless_ui:
    build: .
    devices:
      - "/dev/video0:/dev/video0"
      - "/dev/gpiomem:/dev/gpiomem"
    privileged: true
    environment:
      - MQTT_BROKER=192.168.1.100
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    restart: unless-stopped

  simulation:
    build: .
    command: ["python", "src/simulation.py"]
    environment:
      - MQTT_BROKER=localhost
      - PYTHONPATH=/app
    ports:
      - "8081:8080"
    volumes:
      - ./src:/app/src

  camera-test:
    build: .
    command: ["python", "src/main.py"]
    devices:
      - "/dev/video0:/dev/video0"
    privileged: true
    environment:
      - MQTT_BROKER=localhost
      - MOCK_HARDWARE=1
      - GESTURE_VIP=Pointing_Up
      - GESTURE_PWD=Peace_Sign
      - PYTHONPATH=/app
    ports:
      - "8082:8080"
    volumes:
      - ./src:/app/src

  hw-test:
    build: .
    command: ["python", "tests/hardware_guided_test.py"]
    devices:
      - "/dev/gpiomem:/dev/gpiomem"
    privileged: true
    stdin_open: true
    tty: true
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests

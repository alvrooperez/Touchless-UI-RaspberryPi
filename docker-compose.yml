services:
  touchless_ui:
    build: .
    devices:
      - "/dev/video0:/dev/video0"
      - "/dev/gpiomem:/dev/gpiomem"
    privileged: true
    environment:
      - MQTT_BROKER=192.168.1.100
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    restart: unless-stopped

  simulation:
    build: .
    command: ["python", "src/simulation.py"]
    environment:
      - MQTT_BROKER=localhost
      - PYTHONPATH=/app
    ports:
      - "8081:8080"
    volumes:
      - ./src:/app/src

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Touchless UI Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .gesture-card { transition: all 0.3s ease; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center font-sans">
    
    <div class="gesture-card bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-10 max-w-md w-full text-center">
        <h1 class="text-3xl font-bold mb-2 text-slate-200">Touchless UI</h1>
        <p class="text-sm text-slate-400 mb-8 flex items-center justify-center gap-2">
            <span id="connection-status" class="w-3 h-3 rounded-full bg-yellow-500 inline-block"></span>
            <span id="connection-text">Connecting...</span>
        </p>
        
        <div class="py-8 bg-slate-900 rounded-xl border border-slate-700/50 mb-6">
            <p class="text-sm text-slate-400 uppercase tracking-widest font-semibold mb-2">Current Gesture</p>
            <div id="gesture-display" class="text-4xl font-extrabold text-blue-400 min-h-[60px] flex items-center justify-center">
                {{ gesture }}
            </div>
        </div>
    </div>

    <script>
        const gestureDisplay = document.getElementById('gesture-display');
        const connectionStatus = document.getElementById('connection-status');
        const connectionText = document.getElementById('connection-text');

        // Connect to SSE stream
        const eventSource = new EventSource('/stream');

        eventSource.onopen = function() {
            connectionStatus.classList.remove('bg-yellow-500', 'bg-red-500');
            connectionStatus.classList.add('bg-green-500');
            connectionText.textContent = "Live";
        };

        eventSource.onmessage = function(event) {
            const newGesture = event.data;
            gestureDisplay.textContent = newGesture;
            
            // Visual pop effect
            gestureDisplay.classList.remove('scale-100');
            gestureDisplay.classList.add('scale-110', 'text-indigo-400');
            setTimeout(() => {
                gestureDisplay.classList.remove('scale-110', 'text-indigo-400');
                gestureDisplay.classList.add('scale-100');
            }, 200);
        };

        eventSource.onerror = function() {
            connectionStatus.classList.remove('bg-green-500', 'bg-yellow-500');
            connectionStatus.classList.add('bg-red-500');
            connectionText.textContent = "Disconnected";
        };
    </script>
</body>
</html>
